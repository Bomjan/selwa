<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile — Selwa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css" />
    <style>
      .profile-page { max-width: 520px; margin: 60px auto; padding: 0 16px 80px; }
      .profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
      .profile-avatar {
        width: 72px; height: 72px; border-radius: 50%;
        background: var(--gold); color: #fff;
        font-size: 1.6rem; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px;
      }
      .profile-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 2px; }
      .profile-email { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
      .profile-section { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; }
      .profile-section h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
      .cart-summary-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 6px 0; border-bottom: 1px solid var(--border); }
      .cart-summary-item:last-child { border-bottom: none; }
      .empty-note { color: var(--text-muted); font-size: 0.875rem; }
      .logout-btn { margin-top: 24px; width: 100%; }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="s-nav">
      <a class="s-logo" href="index.html">Selwa</a>
      <div class="nav-links" id="nav-links">

        <a class="nav-link" href="products.html">Products</a>
        <a class="nav-link" href="artisans.html">Artisans</a>
        <a class="nav-link" href="about.html">About</a>
      </div>
      <div class="nav-utils">
        <span id="nav-auth-item"></span>
        <a href="cart.html" class="s-cart-btn">
          <i class="bi bi-bag"></i><span class="s-cart-label"> Cart</span>
          <span id="cart-count">0</span>
        </a>
      </div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <i class="bi bi-list"></i>
      </button>
    </nav>

    <div class="profile-page">
      <div class="profile-card">
        <div class="profile-avatar" id="profile-avatar">?</div>
        <div class="profile-name" id="profile-name">—</div>
        <div class="profile-email" id="profile-email">—</div>

        <div class="profile-section">
          <h3><i class="bi bi-bag"></i> Cart summary</h3>
          <div id="cart-summary-list"></div>
          <div style="margin-top: 12px;">
            <a href="cart.html" class="s-btn s-btn--outline-dark s-btn--sm">View cart</a>
          </div>
        </div>

        <button class="s-btn s-btn--dark logout-btn" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Sign out
        </button>
      </div>
    </div>

    <script src="javascript/global.js"></script>
    <script>
      function logout() {
        localStorage.removeItem('selwa_user');
        window.location.href = 'index.html';
      }

      document.addEventListener('DOMContentLoaded', () => {
        const user = getUser();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('profile-avatar').textContent =
          user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-email').textContent = user.email;

        const cart = getCart();
        const listEl = document.getElementById('cart-summary-list');
        if (cart.length === 0) {
          listEl.innerHTML = '<p class="empty-note">Your cart is empty.</p>';
        } else {
          listEl.innerHTML = cart.map(item =>
            `<div class="cart-summary-item">
              <span>${item.name} × ${item.qty}</span>
              <span>Nu. ${(item.price * item.qty).toLocaleString()}</span>
            </div>`
          ).join('');
        }
      });
    </script>
  </body>
</html>
