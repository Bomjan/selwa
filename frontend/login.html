<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Selwa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css" />
    <style>
      .auth-body { margin: 0; padding: 0; }
      .auth-split { display: flex; min-height: 100vh; width: 100%; overflow-x: hidden; }
      .auth-split__brand { width: 42%; background: var(--gold); display: flex; flex-direction: column; padding: 48px 52px; position: relative; overflow: hidden; flex-shrink: 0; }
      .auth-split__brand::after { content: '\5c71'; position: absolute; bottom: -48px; right: -16px; font-size: 22rem; line-height: 1; color: rgba(255,255,255,.04); font-family: serif; pointer-events: none; user-select: none; }
      .auth-split__logo { font-family: 'DM Sans', sans-serif; font-size: .7rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: rgba(255,255,255,.5); text-decoration: none; }
      .auth-split__copy { margin-top: auto; position: relative; z-index: 1; }
      .auth-split__heading { font-size: clamp(1.75rem, 3vw, 2.5rem); color: #fff; font-weight: 700; line-height: 1.2; margin-bottom: 20px; }
      .auth-split__rule { width: 32px; height: 2px; background: rgba(255,255,255,.35); margin-bottom: 20px; }
      .auth-split__sub { font-size: .8rem; color: rgba(255,255,255,.55); line-height: 1.8; max-width: 260px; }
      .auth-split__img { width: 100%; max-width: 200px; opacity: .12; margin-top: 40px; position: relative; z-index: 1; filter: grayscale(1); }
      .auth-split__form { flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; padding: 56px 64px; position: relative; overflow-y: auto; }
      .auth-back-link { position: absolute; top: 28px; left: 32px; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color .15s; }
      .auth-back-link:hover { color: var(--gold); }
      .auth-split__inner { width: 100%; max-width: 320px; }
      .auth-split__title { font-size: 1.5rem; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
      .auth-split__subtitle { font-size: .8rem; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; }
      .auth-label { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; margin-top: 16px; }
      .auth-label:first-child { margin-top: 0; }
      .auth-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); background: #fff; font-size: .875rem; font-family: 'DM Sans', sans-serif; color: var(--ink); outline: none; transition: border-color .15s; display: block; margin-bottom: 0; }
      .auth-input:focus { border-color: var(--gold); }
      .auth-input::placeholder { color: var(--text-faint); }
      .auth-input.with-toggle { padding-right: 42px; }
      .auth-input-wrapper { position: relative; }
      .password-toggle { position: absolute; right: 0; top: 0; bottom: 0; width: 38px; background: none; border: none; cursor: pointer; color: var(--text-faint); display: flex; align-items: center; justify-content: center; font-size: .85rem; transition: color .15s; }
      .password-toggle:hover { color: var(--ink); }
      .auth-submit { width: 100%; margin-top: 22px; padding: 11px; background: var(--ink); color: #fff; border: none; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background .15s; margin-bottom: 0; }
      .auth-submit:hover { background: var(--gold); }
      .auth-submit:disabled { opacity: .5; cursor: not-allowed; }
      .auth-switch { margin-top: 20px; font-size: .75rem; color: var(--text-faint); text-align: center; }
      .auth-switch a { color: var(--gold); font-weight: 600; text-decoration: none; }
      .auth-switch a:hover { color: var(--gold-deep); }
      #auth-error { font-size: .78rem; color: #c0392b; border-left: 3px solid #c0392b; padding: 8px 12px; background: #fdf5f5; margin-bottom: 14px; }
      .strength-bar { height: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
      .strength-fill { height: 100%; width: 0; transition: width .25s, background .25s; }
      .strength-text { font-size: .68rem; margin-top: 4px; color: var(--text-faint); letter-spacing: .04em; }
      @media (max-width: 700px) {
        .auth-body { overflow: auto; }
        .auth-split { flex-direction: column; overflow-y: auto; height: auto; min-height: 100vh; }
        .auth-split__brand { width: 100%; height: 180px; padding: 24px 24px 20px; flex-direction: row; align-items: flex-end; flex-wrap: wrap; gap: 0; }
        .auth-split__brand::after { display: none; }
        .auth-split__logo { position: static; width: 100%; margin-bottom: 0; }
        .auth-split__copy { margin-top: auto; }
        .auth-split__heading { font-size: 1.3rem; margin-bottom: 0; }
        .auth-split__rule { display: none; }
        .auth-split__sub { display: none; }
        .auth-split__img { display: none; }
        .auth-split__form { flex: 1; padding: 36px 24px 40px; min-height: 0; }
        .auth-back-link { top: 16px; left: 20px; }
        .auth-split__inner { max-width: 100%; }
        .auth-split__title { font-size: 1.4rem; }
      }
    </style>
  </head>
  <body class="auth-body">

    <div class="auth-split">

      <!-- Left — brand -->
      <div class="auth-split__brand">
        <a href="index.html" class="auth-split__logo">Selwa</a>
        <div class="auth-split__copy">
          <h1 class="auth-split__heading">Where every<br>craft tells<br>a story.</h1>
          <div class="auth-split__rule"></div>
          <p class="auth-split__sub">Handmade in Bhutan. Every purchase goes directly to the artisan who made it.</p>
        </div>
        <img class="auth-split__img" src="images/selwa.bt.jpeg" alt="Selwa artisan market" />
      </div>

      <!-- Right — form -->
      <div class="auth-split__form">
        <a href="index.html" class="auth-back-link"><i class="bi bi-arrow-left"></i> Back</a>

        <div class="auth-split__inner">
          <h2 class="auth-split__title">Welcome back</h2>
          <p class="auth-split__subtitle">Sign in to continue supporting Bhutanese artisans.</p>

          <form id="login-form" novalidate>
            <label class="auth-label" for="email">Email</label>
            <input type="email" id="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required />

            <label class="auth-label" for="login-password">Password</label>
            <div class="auth-input-wrapper">
              <input type="password" id="login-password" class="auth-input with-toggle" placeholder="Your password" autocomplete="current-password" required />
              <button type="button" class="password-toggle" data-target="login-password" aria-label="Toggle password">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <button type="submit" class="auth-submit">Sign in</button>
          </form>

          <div class="auth-switch">
            No account? <a href="signup.html">Create one free</a>
          </div>
        </div>
      </div>

    </div>

    <script src="javascript/auth.js"></script>
  </body>
</html>
