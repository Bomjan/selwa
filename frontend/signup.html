<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — Selwa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">

    <div class="auth-split">

      <!-- Left — brand -->
      <div class="auth-split__brand">
        <a href="index.html" class="auth-split__logo">Selwa</a>
        <div class="auth-split__copy">
          <h1 class="auth-split__heading">Join the<br>community<br>of craft.</h1>
          <div class="auth-split__rule"></div>
          <p class="auth-split__sub">Your first purchase supports a real artisan family in Bhutan.</p>
        </div>
        <img class="auth-split__img" src="images/selwa.bt.jpeg" alt="Selwa artisan market" />
      </div>

      <!-- Right — form -->
      <div class="auth-split__form">
        <a href="index.html" class="auth-back-link"><i class="bi bi-arrow-left"></i> Back</a>

        <div class="auth-split__inner">
          <h2 class="auth-split__title">Create account</h2>
          <p class="auth-split__subtitle">Free to join. No subscription, no hidden fees.</p>

          <form id="signup-form" novalidate>
            <label class="auth-label" for="full-name">Full name</label>
            <input type="text" id="full-name" class="auth-input" placeholder="Your name" autocomplete="name" required />

            <label class="auth-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" class="auth-input" placeholder="you@example.com" autocomplete="email" required />

            <label class="auth-label" for="password">Password</label>
            <div class="auth-input-wrapper">
              <input type="password" id="password" class="auth-input with-toggle" placeholder="Create a password" autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="strength-text" id="strength-text"></div>

            <label class="auth-label" for="confirm-password" style="margin-top:14px">Confirm password</label>
            <div class="auth-input-wrapper">
              <input type="password" id="confirm-password" class="auth-input with-toggle" placeholder="Repeat password" autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Toggle password">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <button type="submit" class="auth-submit">Create account</button>
          </form>

          <div class="auth-switch">
            Already have an account? <a href="login.html">Sign in</a>
          </div>
        </div>
      </div>

    </div>

    <script src="javascript/auth.js"></script>
  </body>
</html>
