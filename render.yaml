databases:
  - name: selwa-db
    databaseName: selwa
    user: selwa
    plan: free

services:
  - type: web
    name: selwa
    runtime: go
    rootDir: backend
    buildCommand: go build -o ./selwa-server .
    startCommand: ./selwa-server
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: selwa-db
          property: connectionString
